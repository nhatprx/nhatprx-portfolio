name: Deploy Portfolio to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Lint)
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Deploy to AWS EC2 via SSH & rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_HOST_KEY: ${{ secrets.EC2_SSH_HOST_KEY }}
        run: |
          EC2_HOST="${EC2_HOST:-13.250.247.238}"
          EC2_USER="${EC2_USER:-ubuntu}"

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Pin the host key. `ssh-keyscan` does not verify anything, so
          # trusting its output lets anyone who can intercept the connection
          # present their own key and take the deploy key. Instead the pinned
          # fingerprint from the secret must match what the host presents.
          if [ -z "$EC2_SSH_HOST_KEY" ]; then
            echo "::error::EC2_SSH_HOST_KEY secret is not set"
            exit 1
          fi
          EXPECTED_FINGERPRINT=$(printf '%s' "$EC2_SSH_HOST_KEY" | tr ' ' '\n' | grep -E '^SHA256:' | head -1)
          HOST_KEYS=$(ssh-keyscan -H "$EC2_HOST" 2>/dev/null)
          if [ -z "$HOST_KEYS" ]; then
            echo "::error::could not read the host key of $EC2_HOST"
            exit 1
          fi
          ACTUAL_FINGERPRINTS=$(printf '%s\n' "$HOST_KEYS" | ssh-keygen -lf - | awk '{print $2}')
          if ! printf '%s\n' "$ACTUAL_FINGERPRINTS" | grep -qxF "$EXPECTED_FINGERPRINT"; then
            echo "::error::SSH host key mismatch for $EC2_HOST (expected $EXPECTED_FINGERPRINT, got $(printf '%s' "$ACTUAL_FINGERPRINTS" | tr '\n' ' '))"
            exit 1
          fi
          printf '%s\n' "$HOST_KEYS" >> ~/.ssh/known_hosts

          # Deploy frontend. /var/www/html is owned by root, so the copy runs
          # through sudo on the remote side.
          rsync -avz --delete --rsync-path="sudo rsync" \
            dist/ "$EC2_USER@$EC2_HOST:/var/www/html/"

          # Deploy API. The filter protects node_modules from --delete:
          # --exclude only skips the transfer, it does not stop the deletion
          # of a directory that is not in the source.
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .testdata \
            --filter='P node_modules' \
            server/ "$EC2_USER@$EC2_HOST:/home/ubuntu/nhatprx-api/"

          # Install production dependencies
          ssh "$EC2_USER@$EC2_HOST" \
            "cd /home/ubuntu/nhatprx-api && npm ci --omit=dev"

          # Install the nginx vhost so the security headers in the repo are
          # the ones that run in production. The HTTPS vhost is validated
          # before it replaces the live one, and the previous file is kept
          # so a broken config can be rolled back by hand.
          scp server/nginx/nhatprx.com.ssl.conf "$EC2_USER@$EC2_HOST:/tmp/nhatprx.com.ssl.conf.new"
          ssh "$EC2_USER@$EC2_HOST" \
            "sudo cp /etc/nginx/sites-available/nhatprx.com.ssl.conf /etc/nginx/sites-available/nhatprx.com.ssl.conf.bak && sudo cp /tmp/nhatprx.com.ssl.conf.new /etc/nginx/sites-available/nhatprx.com.ssl.conf && sudo nginx -t && sudo systemctl reload nginx"

          # Restart the API
          ssh "$EC2_USER@$EC2_HOST" \
            "sudo systemctl restart nhatprx-api"

          # Generate deployment metadata
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"

          {
            printf 'PROJECT=%s\n' "$GITHUB_REPOSITORY"
            printf 'BRANCH=%s\n' "$GITHUB_REF_NAME"
            printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA"
            printf 'COMMIT_SHORT=%s\n' "$(git rev-parse --short HEAD)"
            printf 'COMMIT_MESSAGE=%s\n' "$COMMIT_MESSAGE"
            printf 'DEPLOYED_AT=%s\n' "$DEPLOYED_AT"
          } > VERSION

          # Upload version metadata
          scp VERSION "$EC2_USER@$EC2_HOST:/home/ubuntu/nhatprx-api/VERSION"