name: Deploy Portfolio to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
    contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Lint)
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Deploy to AWS EC2 via SSH & rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # The `secrets` context does not support `||` fallbacks, so the
          # defaults are applied here in the shell instead.
          EC2_HOST="${EC2_HOST:-13.250.247.238}"
          EC2_USER="${EC2_USER:-ubuntu}"

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Sync built dist directory to Nginx web root
          rsync -avz --delete dist/ "$EC2_USER@$EC2_HOST:/var/www/html/"

          # Deploy the admin API (S3 presign + content store + Bedrock) and restart it
          # `nginx/` holds the vhost, which is installed once via setup-tls.sh,
          # not on every deploy.
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .testdata \
            --exclude nginx \
            server/ "$EC2_USER@$EC2_HOST:/home/ubuntu/nhatprx-api/"

          ssh "$EC2_USER@$EC2_HOST" "cd /home/ubuntu/nhatprx-api && npm ci --omit=dev"

          # Set standard web permissions and reload Nginx
          ssh "$EC2_USER@$EC2_HOST" "sudo chmod -R 755 /var/www/html && sudo systemctl restart nhatprx-api && sudo systemctl reload nginx"