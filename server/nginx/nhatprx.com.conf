server {
    listen 80;
    listen [::]:80;

    root /var/www/html;
    index index.html;

    # Security headers.
    #
    # `frame-ancestors 'none'` blocks clickjacking of the admin dashboard,
    # and `object-src 'none'` plus `base-uri 'self'` stop a script from
    # rewriting the page base or embedding an object.
    #
    # The policy has to allow what the page actually loads: Google Fonts
    # (fonts.googleapis.com for the stylesheet, fonts.gstatic.com for the
    # font files) and the inline script that restores the scroll position.
    # 'unsafe-inline' is kept for style-src only, because React and the
    # charts set inline styles.
    #
    # HSTS is set on the TLS vhost only: sending it over plain HTTP is
    # ignored by browsers anyway.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Primary domain and the www alias.
    server_name nhatprx.com www.nhatprx.com;

    # TLS is terminated in nhatprx.com.ssl.conf; send everything there.
    # Before the certificate exists this still serves the app over HTTP, so
    # the site is usable while the DNS change is propagating.
    location / {
        try_files $uri $uri/ /index.html;
        # The security headers are declared in the server block. nginx drops
        # them for any location that has its own add_header, so they are
        # repeated here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        # The asset file name carries the build hash, so it can be cached
        # forever. `expires` already sets max-age; the header below adds
        # `immutable` on top of it.
        expires 1y;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
