server {
    listen 80;
    listen [::]:80;

    root /var/www/html;
    index index.html;

    # Primary domain and the www alias.
    server_name nhatprx.com www.nhatprx.com;

    # TLS is terminated in nhatprx.com.ssl.conf; send everything there.
    # Before the certificate exists this still serves the app over HTTP, so
    # the site is usable while the DNS change is propagating.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
