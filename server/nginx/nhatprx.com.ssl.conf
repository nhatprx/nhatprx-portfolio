# TLS vhost for nhatprx.com, installed by server/setup-tls.sh after certbot
# issues the certificate. certbot only fills in the two ssl_certificate
# directives; everything else stays as written here.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name nhatprx.com www.nhatprx.com;

    ssl_certificate /etc/letsencrypt/live/nhatprx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhatprx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Security headers.
    #
    # `frame-ancestors 'none'` blocks clickjacking of the admin dashboard,
    # and `object-src 'none'` plus `base-uri 'self'` stop a script from
    # rewriting the page base or embedding an object.
    #
    # The policy has to allow what the page actually loads: Google Fonts
    # (fonts.googleapis.com for the stylesheet, fonts.gstatic.com for the
    # font files) and the inline script that restores the scroll position.
    # 'unsafe-inline' is kept for style-src only, because React and the
    # charts set inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: only meaningful over TLS, so it lives on the 443 vhost.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/rss text/calendar application/vnd.ms-excel image/svg+xml;

    location /assets/ {
        # The asset file name carries the build hash, so it can be cached
        # forever. `expires` already sets max-age; the header below adds
        # `immutable` on top of it.
        expires 1y;
        # The security headers are declared in the server block. nginx drops
        # them for any location that has its own add_header, so they are
        # repeated here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
    }

    # Admin API: S3 presigned resume uploads + persisted portfolio content.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Repeated for the same reason as in the /assets/ block: a location
        # with its own add_header does not inherit the server-level ones.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
    }
}
