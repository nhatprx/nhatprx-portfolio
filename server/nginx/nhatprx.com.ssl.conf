# TLS vhost for nhatprx.com, installed by server/setup-tls.sh after certbot
# issues the certificate. certbot only fills in the two ssl_certificate
# directives; everything else stays as written here.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name nhatprx.com www.nhatprx.com;

    ssl_certificate /etc/letsencrypt/live/nhatprx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhatprx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/rss text/calendar application/vnd.ms-excel image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin API: S3 presigned resume uploads + persisted portfolio content.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
